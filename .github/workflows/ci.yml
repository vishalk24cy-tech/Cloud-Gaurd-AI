name: CloudGuardAI CI/CD & DevSecOps Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Lint, Security & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      DATABASE_NAME: cloudguardai_test
      JWT_SECRET_KEY: test-ci-secret-key-32-chars-long-minimum
      JWT_ALGORITHM: HS256
      DEFAULT_AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python Runtime (3.12)
        # actions/setup-python@v5.4.0
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Dependency Consistency Check
        run: |
          python -m pip check

      - name: Run Backend Health Probes Validation
        run: |
          python -m pytest backend/test_health_endpoints.py -v --tb=short

      - name: Run Backend Security & Tenant Isolation Validation
        run: |
          python -m pytest backend/test_phase5_security_qa_validation.py backend/test_phase4_e2e_integration.py -v --tb=short

      - name: Run Full Backend Test Suite
        run: |
          python -m pytest backend/ -q --tb=short

  frontend-ci:
    name: Frontend Lint & Production Bundle Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js Environment (Node 20 LTS)
        # actions/setup-node@v4.2.0
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies Reproducibly
        run: |
          npm ci --prefix frontend

      - name: Run ESLint
        run: |
          npm run lint --prefix frontend

      - name: Run Production Bundle Build (Vite)
        run: |
          npm run build --prefix frontend

  devsecops-audit:
    name: Static Security & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate No Committed Secrets or .env Files
        run: |
          echo "Verifying no active .env or credential files are tracked in git..."
          ! git ls-files --error-unmatch backend/.env 2>/dev/null
          ! git ls-files --error-unmatch frontend/.env 2>/dev/null

      - name: Automated Secret Pattern Scan
        run: |
          echo "Scanning codebase for exposed AWS or provider tokens..."
          ! grep -rE "(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z\\-_]{35}|ghp_[0-9a-zA-Z]{36})" \
            --exclude-dir={.git,node_modules,venv,dist,.pytest_cache} .

      - name: Frontend Dependency Vulnerability Audit
        run: |
          echo "Running npm audit for critical production vulnerabilities..."
          npm audit --prefix frontend --audit-level=critical || true
